name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site for GitHub Pages
        env:
          # If CUSTOM_DOMAIN is set (e.g. jobshore.dpdns.org), automatically use https://<CUSTOM_DOMAIN> and root '/' base path.
          # Otherwise, default to https://ahbeeahkao.github.io with '/jobshore' base path.
          PUBLIC_SITE_URL: ${{ vars.CUSTOM_DOMAIN && format('https://{0}', vars.CUSTOM_DOMAIN) || vars.PUBLIC_SITE_URL || 'https://ahbeeahkao.github.io' }}
          BASE_PATH: ${{ vars.CUSTOM_DOMAIN && '/' || vars.BASE_PATH || '/jobshore' }}
        run: npm run build

      - name: Generate CNAME file if CUSTOM_DOMAIN variable is set
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > ./dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
